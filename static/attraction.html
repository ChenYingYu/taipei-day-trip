<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attraction</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/attraction.js" defer></script>
    <script src="/static/user.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="container">
        <a href="/" style="text-decoration: none">
          <h1 style="color: #448899">台北一日遊</h1>
        </a>
        <div class="nav--links">
          <button class="nav--booking font-medium">預定行程</button>
          <button class="nav--auth font-medium" id="auth-btn">登入/註冊</button>
        </div>
      </nav>
    </header>

    <hr />

    <main class="attraction-main">
      <section class="attraction-top">
        <div class="slideshow">
          <div class="slideshow__container" id="slideshow-container"></div>
          <button class="slideshow__btn left" id="prev-btn">
            <img src="/static/images/left_arrow.png" alt="Previous" />
          </button>
          <button class="slideshow__btn right" id="next-btn">
            <img src="/static/images/right_arrow.png" alt="Next" />
          </button>
          <div class="slideshow__indicators" id="indicators"></div>
        </div>

        <div class="attraction-profile">
          <div class="attraction-simple-intro">
            <h3 id="attraction-name" class="font-bold"></h3>
            <p id="attraction-category-mrt" class="font-regular"></p>
          </div>

          <form class="booking-form" id="attraction-bookSection">
            <p class="font-bold">訂購導覽行程</p>
            <p class="font-regular">
              以此景點為中心的一日行程，帶您探索城市角落故事
            </p>

            <div class="form-group">
              <label class="font-medium">選擇日期：</label>
              <input type="date" id="booking-date" />
            </div>

            <div class="form-group">
              <label class="font-medium">選擇時間：</label>
              <div class="time-selection">
                <input
                  type="radio"
                  name="time"
                  value="morning"
                  id="morning"
                  checked
                />
                <label for="morning" class="font-regular">上半天</label>
                <input
                  type="radio"
                  name="time"
                  value="afternoon"
                  id="afternoon"
                />
                <label for="afternoon" class="font-regular">下半天</label>
              </div>
            </div>

            <div class="price-display">
              <p class="body-bold">導覽費用：</p>
              <p id="booking-price" class="font-regular">新台幣 2000 元</p>
            </div>
            <button type="submit" class="btn-primary">開始預約行程</button>
          </form>
        </div>
      </section>

      <hr />

      <section class="attraction-info">
        <p id="description"></p>
        <div class="info-block">
          <p class="font-bold">景點地址：</p>
          <p id="address"></p>
        </div>
        <div class="info-block">
          <p class="font-bold">交通方式：</p>
          <p id="transport"></p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__text">COPYRIGHT © 2021 台北一日遊</div>
    </footer>
    <div id="auth-modal" class="modal">
      <div class="modal-content">
        <div class="modal-decorator"></div>
        <button id="close-modal" class="close-btn"></button>

        <div id="signin-view" class="modal-view">
          <h3>登入會員帳戶</h3>
          <input type="email" id="signin-email" placeholder="輸入電子郵件" />
          <input type="password" id="signin-password" placeholder="輸入密碼" />
          <button id="signin-btn" class="auth-submit">登入帳戶</button>
          <p id="signin-error" class="error-msg"></p>
          <p class="switch-text">
            還沒有帳戶？<span id="to-signup" class="switch-link">點此註冊</span>
          </p>
        </div>

        <div id="signup-view" class="modal-view" style="display: none">
          <h3>註冊會員帳戶</h3>
          <input type="text" id="signup-name" placeholder="輸入姓名" />
          <input type="email" id="signup-email" placeholder="輸入電子郵件" />
          <input type="password" id="signup-password" placeholder="輸入密碼" />
          <button id="signup-btn" class="auth-submit">註冊新帳戶</button>
          <p id="signup-error" class="error-msg"></p>
          <p id="signup-success" class="success-msg"></p>
          <p class="switch-text">
            已經有帳戶了？<span id="to-signin" class="switch-link"
              >點此登入</span
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
